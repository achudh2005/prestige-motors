apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestige-motors
  labels:
    app: prestige-motors
    app.kubernetes.io/name: prestige-motors
    app.kubernetes.io/component: frontend
    app.openshift.io/runtime: nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prestige-motors
  template:
    metadata:
      labels:
        app: prestige-motors
    spec:
      containers:
        - name: prestige-motors
          image: image-registry.openshift-image-registry.svc:5000/prestige-motors/prestige-motors:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
